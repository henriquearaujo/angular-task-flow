<div class="min-h-screen bg-slate-950 text-white">
  <header class="border-b border-slate-800 p-4 flex justify-between items-center">
    <h1 class="text-xl font-semibold">Fluxo de Tarefas</h1>
    <span class="text-sm text-slate-400">Angular + Tailwind</span>
  </header>

  <main class="p-6">
    <div class="max-w-5xl mx-auto">

      <!-- Header -->
      <div class="mb-6">
        <h2 class="text-2xl font-bold">Dashboard</h2>
        <p class="text-slate-400">Gerencie suas tarefas com eficiência</p>
      </div>

      <!-- Cards -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
        
        <div class="bg-slate-900 p-4 rounded-xl border border-slate-800">
          <h3 class="text-sm text-slate-400">Total</h3>
          <p class="text-2xl font-bold mt-2">{{ totalTasks() }}</p>
        </div>

        <div class="bg-slate-900 p-4 rounded-xl border border-slate-800">
          <h3 class="text-sm text-slate-400">Concluídas</h3>
          <p class="text-2xl font-bold mt-2 text-green-400">
            {{ completedTasks() }}
          </p>
        </div>

        <div class="bg-slate-900 p-4 rounded-xl border border-slate-800">
          <h3 class="text-sm text-slate-400">Pendentes</h3>
          <p class="text-2xl font-bold mt-2 text-yellow-400">
            {{ pendingTasks() }}
          </p>
        </div>

      </div>

      <!-- Form -->
      <app-task-form
        [taskToEdit]="editingTask()"
        [isLoading]="isLoading()"
        (create)="addTask($event)"
        (update)="updateTask($event)"
        (cancel)="cancelEditing()"
      ></app-task-form>

      <!-- Filtros -->
      <div class="mb-4 flex gap-2">
        <button
          class="rounded-lg px-4 py-2 text-sm font-semibold transition"
          [class.bg-indigo-500]="selectedFilter() === 'all'"
          [class.bg-slate-800]="selectedFilter() !== 'all'"
          (click)="changeFilter('all')"
        >
          Todas
        </button>

        <button
          class="rounded-lg px-4 py-2 text-sm font-semibold transition"
          [class.bg-indigo-500]="selectedFilter() === 'pending'"
          [class.bg-slate-800]="selectedFilter() !== 'pending'"
          (click)="changeFilter('pending')"
        >
          Pendentes
        </button>

        <button
          class="rounded-lg px-4 py-2 text-sm font-semibold transition"
          [class.bg-indigo-500]="selectedFilter() === 'completed'"
          [class.bg-slate-800]="selectedFilter() !== 'completed'"
          (click)="changeFilter('completed')"
        >
          Concluídas
        </button>
      </div>

      @if (isLoading()) {
        <div class="rounded-xl border border-slate-800 bg-slate-900 p-6 text-center text-slate-300">
          Atualizando tarefas...
        </div>
      } @else {
        <app-task-list
          [tasks]="filteredTasks()"
          (toggle)="toggleTaskStatus($event)"
          (remove)="removeTask($event)"
          (edit)="startEditing($event)"
        ></app-task-list>
      }

    </div>
    <app-toast
      [message]="toastMessage()"
      [visible]="showToast()"
    ></app-toast>
  </main>
</div>
